name: publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      # QEMU registers binfmt handlers so buildx can run the arm64 stage of the
      # build on this amd64 runner. The Dockerfile is arch-neutral - Debian slim,
      # apt packages, one npm global install - so emulation is slow rather than
      # fragile, and publish is tag-triggered, so slow is acceptable.
      - uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          # A multi-platform push produces a manifest list on top of the
          # per-platform images. Put the OCI annotations on that list as well as
          # on each image, so ghcr still sees org.opencontainers.image.source at
          # the tag it links to this repo - that label is what carries the
          # package's access inheritance (see README "Releasing").
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ghcr.io/onideus/blast-base
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          # Every tag is a manifest list covering both. A consumer on Apple
          # Silicon or an arm64 server pulls the native image; before this,
          # every arm64 host ran the amd64 image under emulation.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: |
            BLAST_BASE_VERSION=${{ github.ref_name }}
